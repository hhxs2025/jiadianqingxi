<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录-家电清洗服务预约</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --brand:#2f7cf6;--brand-dark:#1e63d8;--text:#1f2937;--muted:#8b95a7;
    --line:#e8ecf4;--ok:#0f9d58;--err:#e5484d;--radius:16px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(165deg,#e8f0ff 0%,#f7f9fd 42%,#f4f6fb 100%);
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 18px;-webkit-font-smoothing:antialiased;font-size:15px;
  }

  /* ============ 右上角入口 ============ */
  .corner-entry{
    position:fixed;
    top:14px;
    right:14px;
    z-index:50;
    display:flex;
    gap:8px;
  }
  .corner-entry a{
    display:flex;
    align-items:center;
    gap:6px;
    height:36px;
    padding:0 12px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(47,124,246,.12);
    border-radius:20px;
    text-decoration:none;
    color:#4b5563;
    font-size:12.5px;
    font-weight:500;
    transition:.18s;
    box-shadow:0 4px 12px rgba(23,43,77,.06);
    white-space:nowrap;
  }
  .corner-entry a:hover{
    background:#fff;
    border-color:var(--brand);
    color:var(--brand);
    box-shadow:0 6px 16px rgba(47,124,246,.18);
    transform:translateY(-1px);
  }
  .corner-entry a .ico{font-size:15px;line-height:1}

  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:22px}
  .brand .logo{
    width:62px;height:62px;border-radius:20px;margin:0 auto 14px;
    background:linear-gradient(140deg,#4f92ff,#2f7cf6 60%,#1e63d8);
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 10px 24px rgba(47,124,246,.32);
  }
  .brand h1{font-size:21px;font-weight:600;letter-spacing:.3px}
  .brand p{margin-top:7px;font-size:13px;color:var(--muted)}
  .card{
    background:#fff;border-radius:var(--radius);padding:24px 20px 20px;
    box-shadow:0 8px 30px rgba(23,43,77,.08);
  }
  .field{margin-bottom:16px}
  .field label{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:500;color:#4b5563;margin-bottom:8px;
  }
  .field label .opt{
    font-size:11.5px;color:#a8b2c1;font-weight:400;
  }
  .ctrl{
    display:flex;align-items:center;background:#f6f8fc;border:1.5px solid transparent;
    border-radius:12px;padding:0 14px;height:50px;transition:.18s;
  }
  .ctrl:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,124,246,.12)}
  .ctrl input{
    flex:1;border:0;background:transparent;outline:none;font-size:16px;color:var(--text);
    font-family:inherit;min-width:0;
  }
  .ctrl input::placeholder{color:#b6bfcd;font-size:14px}
  .ctrl .prefix{font-size:15px;color:#4b5563;margin-right:8px;font-weight:500}
  .btn{
    width:100%;height:50px;border:0;border-radius:12px;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:.18s;
  }
  .btn-primary{
    background:linear-gradient(135deg,#4f92ff,#2f7cf6);color:#fff;
    box-shadow:0 6px 18px rgba(47,124,246,.3);margin-top:6px;
  }
  .btn-primary:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(47,124,246,.3)}
  .btn-primary:disabled{background:#c3d3ea;box-shadow:none;cursor:not-allowed}
  .tip{
    font-size:13px;line-height:1.5;border-radius:10px;padding:0 12px;max-height:0;
    overflow:hidden;opacity:0;transition:.22s;margin-bottom:0;
  }
  .tip.show{max-height:100px;opacity:1;padding:11px 12px;margin-bottom:14px}
  .tip.ok{background:#e9f8f0;color:var(--ok)}
  .tip.err{background:#fdecec;color:var(--err)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .hint a{color:var(--brand);text-decoration:none}
  .foot{text-align:center;margin-top:20px;font-size:12px;color:#a8b2c1;line-height:1.7}
  .dev-foot{
    text-align:center;margin-top:18px;padding:14px 12px;
    background:rgba(255,255,255,.6);border-radius:12px;
    font-size:12.5px;color:#6b7280;line-height:1.9;
  }
  .dev-foot strong{color:#374151;font-weight:600}
  .dev-foot a{color:#2f7cf6;text-decoration:none}
  .dev-foot a:hover{text-decoration:underline}

  /* 手机上缩小入口按钮 */
  @media (max-width: 420px) {
    .corner-entry{top:10px;right:10px;gap:6px}
    .corner-entry a{
      height:32px;padding:0 10px;font-size:11.5px;
    }
    .corner-entry a .ico{font-size:13px}
    .corner-entry a .txt-long{display:none}
  }
</style>
</head>
<body>

<!-- 右上角入口：师傅 / 管理员 -->
<div class="corner-entry">
  <a href="/engineer/login" title="师傅登录">
   
    <span>师傅<span class="txt-long">登录</span></span>
  </a>
  <a href="/admin/login" title="管理员登录">
   
    <span>管理员<span class="txt-long">登录</span></span>
  </a>
</div>

<div class="wrap">
  <div class="brand">
    <div class="logo">🧼</div>
    <h1>家电清洗服务预约</h1>
    <p>专业上门-明码标价-先约后服务</p>
  </div>

  <div class="card">
    <div class="tip" id="tip"></div>

    <div class="field">
      <label for="phone">手机号</label>
      <div class="ctrl">
        <span class="prefix">+86</span>
        <input id="phone" type="tel" inputmode="numeric" maxlength="11"
               autocomplete="tel" placeholder="请输入 11 位手机号">
      </div>
    </div>

    <div class="field">
      <label for="code">
        <span>服务码</span>
        <span class="opt">选填-没有的话，留空也能预约</span>
      </label>
      <div class="ctrl">
        <input id="code" type="text" maxlength="16"
               autocomplete="off" placeholder="有服务码请填写，可分配专属师傅">
      </div>
      <div class="hint">
        服务码由师傅提供，填了会自动分配专属师傅；<br>
        没有也可以直接登录，客服会尽快与您联系。
      </div>
    </div>

    <button class="btn btn-primary" id="loginBtn" type="button">登录并预约</button>
  </div>

  <div class="foot">
    登录即表示同意《用户服务协议》与《隐私政策》
  </div>

  <div class="dev-foot">
    <strong>开发者：晦华先生</strong><br>
    邮箱：<a href="mailto:2303537063@qq.com">2303537063@qq.com</a><br>
    © 2026 家电清洗服务预约系统·v1.0.3
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const phoneEl = $('phone'), codeEl = $('code'),
        loginBtn = $('loginBtn'), tip = $('tip');

  function showTip(msg, type) {
    tip.textContent = msg;
    tip.className = 'tip show ' + (type || '');
  }
  function hideTip() { tip.className = 'tip'; }

  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    return r.json();
  }

  phoneEl.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '');
  });

  codeEl.addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  [phoneEl, codeEl].forEach(el => {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });
  });

  loginBtn.addEventListener('click', async function () {
    hideTip();
    const phone = phoneEl.value.trim();
    const code = codeEl.value.trim();

    if (!/^1[3-9]\d{9}$/.test(phone)) {
      showTip('请输入正确的 11 位手机号', 'err');
      phoneEl.focus();
      return;
    }
    // 服务码选填，不强制

    loginBtn.disabled = true;
    loginBtn.textContent = '登录中…';
    try {
      const d = await post('/api/login', { phone: phone, code: code });
      if (d.ok) {
        location.href = d.redirect || '/booking';
      } else {
        showTip(d.msg || '登录失败', 'err');
        loginBtn.disabled = false;
        loginBtn.textContent = '登录并预约';
      }
    } catch (e) {
      showTip('网络异常，请检查后重试', 'err');
      loginBtn.disabled = false;
      loginBtn.textContent = '登录并预约';
    }
  });

  (function autoFillFromUrl() {
    const params = new URLSearchParams(location.search);
    const autoCode = (params.get('code') || '').trim().toUpperCase();
    if (!autoCode) return;

    codeEl.value = autoCode;
    showTip('✅ 已为你分配专属师傅，请填写手机号登录', 'ok');
    phoneEl.focus();

    if (history.replaceState) {
      history.replaceState(null, '', location.pathname);
    }
  })();
})();
</script>
</body>
</html>
